# =========================================================
# Application
# =========================================================
spring.application.name=Shopping-Cart
server.port=9081


# =========================================================
# PostgreSQL - Aiven
# =========================================================
spring.datasource.url=jdbc:postgresql://zidtech-devs.b.aivencloud.com:27664/defaultdb?sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update


# =========================================================
# MongoDB - GridFS
# =========================================================
spring.data.mongodb.uri=${MONGO_DB_URI}
spring.data.mongodb.database=shopping_cart_db

# GridFS bucket used for item thumbnails
app.thumbnail.gridfs.bucket=${APP_THUMBNAIL_GRIDFS_BUCKET:thumbnails}


# =========================================================
# MVC / Static Resources
# =========================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.flyway.baseline-on-migrate=true


# =========================================================
# Security & JWT Properties
# =========================================================
app.security.jwt-secret=${JWT_SECRET}
app.security.issuer=shopping-cart-api