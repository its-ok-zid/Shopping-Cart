# App
spring.application.name=Shopping-Cart
server.port=9081

# -----------------------
# PostgreSQL (JDBC)
# -----------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------
# MongoDB (GridFS)
# -----------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# Custom GridFS bucket
app.thumbnail.gridfs.bucket=${APP_THUMBNAIL_GRIDFS_BUCKET}

# -----------------------
# MVC / static resources
# -----------------------
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

# -----------------------
# JWT properties
# -----------------------
security.jwt.secret=${JWT_SECRET}

# These are *not* secrets, so it's okay to keep defaults if you want:
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.jwt.cookie-name=${JWT_COOKIE_NAME:JWT_TOKEN}
security.auth.header=${JWT_AUTH_HEADER:Authorization}
